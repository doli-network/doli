# DOLI CI Workflow
# Runs on pull requests and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    # Pinned: ubuntu-latest = ubuntu-26.04 since Nov 2026; its GCC cannot compile
    # the bundled RocksDB 8.10 (librocksdb-sys 0.16). Same pin as release.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libclang-dev protobuf-compiler zlib1g-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # ImageOS (ubuntu24, win25, ...) goes into the key hash: a cache made
          # on another runner image (other glibc) is never restored here.
          env-vars: ImageOS
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          LIBZ_SYS_STATIC: "0"

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The ~70 test binaries filled the runner disk since 2026-11-02
      # ("No space left on device", ld Bus error). Remove unused preinstalled
      # SDKs; build the tests without debug info (release binaries unaffected).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libclang-dev protobuf-compiler zlib1g-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # ImageOS (ubuntu24, win25, ...) goes into the key hash: a cache made
          # on another runner image (other glibc) is never restored here.
          env-vars: ImageOS
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-features
        env:
          LIBZ_SYS_STATIC: "0"
          RUST_TEST_THREADS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libclang-dev protobuf-compiler zlib1g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # ImageOS (ubuntu24, win25, ...) goes into the key hash: a cache made
          # on another runner image (other glibc) is never restored here.
          env-vars: ImageOS
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --package doli-node
        env:
          LIBZ_SYS_STATIC: "0"

  # Build check for Docker
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: doli-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
