[package]
name = "wallet"
description = "Shared wallet library for DOLI GUI and CLI: key management, RPC client, transaction builder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Cryptography (from workspace)
crypto = { workspace = true }
bip39 = { workspace = true }
hex.workspace = true
zeroize.workspace = true

# Producer transactions: one shared builder and core's signing messages
doli-core = { workspace = true }
doli-producer-tx = { workspace = true }

# Serialization
serde.workspace = true
serde_json.workspace = true

# HTTP client for JSON-RPC
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Test utilities
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
serde_json.workspace = true
# bincode for cross-crate serialization tests.
bincode.workspace = true
