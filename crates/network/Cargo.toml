[package]
name = "network"
description = "P2P networking layer for DOLI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
doli-core = { workspace = true }
crypto = { workspace = true }
libp2p.workspace = true
discv5.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
bincode.workspace = true
futures.workspace = true
async-trait.workspace = true
prost.workspace = true

# INC-I-114 M2: the memory watchdog's Linux RSS sampler
# (watchdog.rs::sample_resident_bytes_linux) calls libc::sysconf(_SC_PAGESIZE).
# Linux-only — macOS/other platforms use the cfg(not(linux)) fail-open path and
# do not need libc. Gated here so the dep is not pulled on non-Linux builds.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
vdf = { workspace = true }
tempfile = { workspace = true }
