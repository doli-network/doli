[package]
name = "storage"
description = "Storage layer for DOLI: blocks, UTXO set, and producer registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
doli-core = { workspace = true }
crypto = { workspace = true }
rocksdb.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
tokio = { workspace = true, features = ["sync"] }
chrono = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
vdf = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
regex = "1"
# umask control for the AUDIT-P2-014 file-mode test: a restrictive ambient umask would
# mask the defect and make the assertion vacuous.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# utxo-scalability M2 — its OWN test binary on purpose. The file installs a
# counting `#[global_allocator]`; a global allocator is per-BINARY, so folding it
# into `tests/it/` would wrap every unrelated storage test and make the measured
# peak unattributable.
[[test]]
name = "m2_canonical_digest_peak_alloc"
path = "tests/m2_canonical_digest_peak_alloc.rs"

# utxo-scalability M2 — their OWN test binaries on purpose. Both name the [F2] API
# (`canonical_digest` / `canonical_range`) that does not exist until the milestone lands,
# so folding them into `tests/it/` would make every unrelated storage integration test
# uncompilable for the whole RED phase.
[[test]]
name = "m2_canonical_fold_byte_equality"
path = "tests/m2_canonical_fold_byte_equality.rs"

[[test]]
name = "m2_canonical_fold_fail_loud"
path = "tests/m2_canonical_fold_fail_loud.rs"
