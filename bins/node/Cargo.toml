[package]
name = "doli-node"
description = "DOLI full node implementation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "doli_node"
path = "src/lib.rs"

[[bin]]
name = "doli-node"
path = "src/main.rs"

[dependencies]
doli-core = { workspace = true }
crypto = { workspace = true }
vdf = { workspace = true }
mempool = { workspace = true }
network = { workspace = true }
storage = { workspace = true }
rpc = { workspace = true }
updater = { workspace = true }
chrono.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
bincode.workspace = true
anyhow.workspace = true
prometheus.workspace = true
lazy_static.workspace = true
axum.workspace = true
toml.workspace = true
dirs.workspace = true
fs2 = "0.4"        # Cross-platform file locking for producer guard
sled = "0.34"      # Embedded database for signed slots tracking
thiserror.workspace = true
reqwest = { version = "0.11", features = ["json"] }  # HTTP client for devnet RPC checks
base64.workspace = true

# fcntl probe of a RocksDB LOCK file (check-producer-set)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
futures.workspace = true
libp2p.workspace = true
wallet = { workspace = true }
doli-cli = { path = "../cli" }

[package.metadata.deb]
name = "doli"
maintainer = "DOLI Network <doli@doli.network>"
section = "net"
priority = "optional"
assets = [
    ["target/release/doli-node", "usr/bin/", "755"],
    ["target/release/doli", "usr/bin/", "755"],
]
extended-description = "DOLI blockchain node and wallet CLI for the proof-of-time network."
maintainer-scripts = "bins/node/"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/doli-node", dest = "/usr/bin/doli-node", mode = "0755" },
    { source = "target/release/doli", dest = "/usr/bin/doli", mode = "0755" },
]
post_install_script = "bins/node/postinst.sh"

# utxo-scalability M1 — its OWN test binary on purpose. The file installs a
# counting `#[global_allocator]`; a global allocator is per-BINARY, so folding it
# into `tests/it/` would wrap every unrelated test in the shared node binary and
# make the measured peak unattributable.
[[test]]
name = "m1_snap_install_peak_alloc"
path = "tests/m1_snap_install_peak_alloc.rs"

# INC-I-171 M4 — its OWN test binary on purpose. The vesting gate ships frozen
# (activation == disable == u64::MAX on every network), so no height can arm it;
# only a process-wide env override can, and `tests/it/` is one shared process
# where another test may freeze NetworkParams first.
[[test]]
name = "inc_i_171_m4_vesting_bound"
path = "tests/inc_i_171_m4_vesting_bound.rs"

[[test]]
name = "inc_i_171_m5_vesting_build"
path = "tests/inc_i_171_m5_vesting_build.rs"

# INC-I-171 M6 — the shadow counters share the M4 constraint: the vesting window
# is armed by a process-wide env override, and `tests/it/` is one shared process
# where another test may freeze NetworkParams first.
[[test]]
name = "inc_i_171_m6_shadow_counter"
path = "tests/inc_i_171_m6_shadow_counter.rs"

# INC-I-217 M9 — own binary, same constraint as inc_i_171_m6_shadow_counter:
# the counter and REGISTRY are process-global lazy_statics and NetworkParams is a
# per-network OnceLock frozen by the first params() call in the process, so a
# delta assertion inside the shared `it` binary is a flake.
[[test]]
name = "bls_rotation_metrics"
path = "tests/bls_rotation_metrics.rs"

# utxo-scalability M3 — its OWN test binary on purpose, same constraint as
# m1_snap_install_peak_alloc: the file installs a counting `#[global_allocator]`,
# which is per-BINARY, so folding it into `tests/it/` would wrap every unrelated
# node test and make the measured peak unattributable. This is the milestone's
# outcome probe (docs/.workflow/m3-outcome-metric.txt).
[[test]]
name = "m3_wire_bound_probe"
path = "tests/m3_wire_bound_probe.rs"

# utxo-scalability M4 — the install-side OUTCOME PROBE
# (docs/.workflow/m4-outcome-metric.txt). Own binary for the same reason as
# m3_wire_bound_probe: `tests/m4_measure/mod.rs` installs a counting
# `#[global_allocator]`, which is per-BINARY.
[[test]]
name = "m4_install_peak_probe"
path = "tests/m4_install_peak_probe.rs"

# utxo-scalability M4 — the RED peak-ratio claim. It shares ONE copy of the
# allocator and the measurement routine with the probe above
# (`tests/m4_measure/mod.rs`), but must live in its own binary: the probe has to
# PASS on pre-M4 code to yield the `before` reading, and this file has to FAIL.
[[test]]
name = "m4_peak_ratio_red"
path = "tests/m4_peak_ratio_red.rs"

# INC-I-237 M5 (F-13 soak) — its OWN test binary on purpose, same constraint as
# m1_snap_install_peak_alloc: the file installs a counting `#[global_allocator]`
# (per-BINARY) to measure retained heap under a sustained flood.
[[test]]
name = "inc_i_237_m5_soak"
path = "tests/inc_i_237_m5_soak.rs"

# INC-I-236 M2 reorg doors — own binaries: `_b` pins the devnet signature AH
# through a process-wide env override (NetworkParams is a per-process OnceLock).
[[test]]
name = "inc_i_236_m2_reorg_doors"
path = "tests/inc_i_236_m2_reorg_doors.rs"

[[test]]
name = "inc_i_236_m2_reorg_doors_b"
path = "tests/inc_i_236_m2_reorg_doors_b.rs"

# INC-I-281 M2.1 recovery doors across an epoch boundary — own binary: the
# outcome probe (.claude/scripts/inc-i-281-m2-probe.sh doors) runs it by name.
[[test]]
name = "inc_i_281_m2_door_epoch_list"
path = "tests/inc_i_281_m2_door_epoch_list.rs"

# INC-I-281 M2.2 rollback memory (R-3b) and the two post-rollback suppressors (R-2)
# — own binaries: the outcome probe (inc-i-281-m2-probe.sh reapply) runs them by name.
[[test]]
name = "inc_i_281_m2_rollback_memory"
path = "tests/inc_i_281_m2_rollback_memory.rs"

[[test]]
name = "inc_i_281_m2_suppressors"
path = "tests/inc_i_281_m2_suppressors.rs"

# INC-I-281 M2.3 post-boundary schedule (P1) — own binary: the outcome probe
# (inc-i-281-m2-probe.sh postboundary) runs it by name.
[[test]]
name = "inc_i_281_m23_post_boundary"
path = "tests/inc_i_281_m23_post_boundary.rs"

# INC-I-281 M2.3 false-rollback hold (P2) — own binary: the outcome probe
# (inc-i-281-m2-probe.sh falserollback) runs it by name.
[[test]]
name = "inc_i_281_m23_false_rollback"
path = "tests/inc_i_281_m23_false_rollback.rs"

# INC-I-281 M3a stub-body serve (M3a.1) and genesis-phase reorg schedule (M3a.2) —
# own binaries: the outcome probe (inc-i-281-m3a-probe.sh) runs them by name.
[[test]]
name = "inc_i_281_m3a_stub_serve"
path = "tests/inc_i_281_m3a_stub_serve.rs"

[[test]]
name = "inc_i_281_m3a_genesis_reorg"
path = "tests/inc_i_281_m3a_genesis_reorg.rs"

# INC-I-281 M2.4 refused-reorg restore (SEC-FIXVERIFY-001) and Light-window door
# (SEC-FIXVERIFY-002) — own binaries: the outcome probe runs them by name.
[[test]]
name = "inc_i_281_m24_refused_reorg"
path = "tests/inc_i_281_m24_refused_reorg.rs"

[[test]]
name = "inc_i_281_m24_light_window"
path = "tests/inc_i_281_m24_light_window.rs"

# INC-I-236 M2 node intake (gossip pre-filter, snap anchor) and apply-entry locks.
[[test]]
name = "inc_i_236_m2_intake_node"
path = "tests/inc_i_236_m2_intake_node.rs"

[[test]]
name = "inc_i_236_m2_apply_locks"
path = "tests/inc_i_236_m2_apply_locks.rs"

# INC-I-236 M2 handle_new_block classification arms (below-AH lock re-execs itself
# with the AH env override: NetworkParams is a per-process OnceLock).
[[test]]
name = "inc_i_236_m2_p3_arms"
path = "tests/inc_i_236_m2_p3_arms.rs"

# INC-I-236 M2 `restore --from-rpc` intake: drives the real doli-node binary
# against a stub archiver RPC (the operation is private to the bin target).
[[test]]
name = "inc_i_236_m2_restore_rpc"
path = "tests/inc_i_236_m2_restore_rpc.rs"
